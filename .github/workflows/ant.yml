# This workflow builds the applets with Ant and runs the jCardsim test suite.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-ant

name: Build Satochip DIY Applets

on:
  schedule:
    - cron: "0 0 1 * *"
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: 'true'
    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'
    - name: Build with Ant
      run: ant
    - name: Generate Checksums (Echo to log)
      working-directory: build
      run: find . -type f ! -name sha256sums.txt -exec sha256sum {} \;
    - name: Generate Checksums (For Artifacts)
      working-directory: build
      run: find . -type f ! -name sha256sums.txt -exec sha256sum {} \; > sha256sums.txt
    - name: Verify Checksums
      working-directory: build
      run: sha256sum -c sha256sums.txt
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Satochip-DIY-Applets
        path: ./build/

  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: 'true'
    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper
    - name: Make gradlew executable
      run: chmod +x tests/gradlew
    - name: Run jCardsim test suite
      working-directory: tests
      run: ./gradlew test --no-daemon --console=plain
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jcardsim-test-reports
        path: tests/**/build/reports/tests/
